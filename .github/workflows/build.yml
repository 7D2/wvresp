name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "3.1.x"

      # 轻量版：不打包运行时，压缩后约 0.4 MB，使用者需自备 .NET Core 3.1 Desktop Runtime
      - name: Publish lite (framework-dependent)
        run: >
          dotnet publish src/wvresp.csproj -c Release -r win-x64 --self-contained false
          -o dist-lite

      # 全量版：运行时一起打包，约 157 MB，双击即用
      - name: Publish self-contained
        run: >
          dotnet publish src/wvresp.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist-full

      - name: Package zips
        shell: pwsh
        run: |
          Compress-Archive -Path (Get-ChildItem dist-lite | ForEach-Object FullName) -DestinationPath wvresp-${{ github.ref_name }}-win-x64-lite.zip
          Compress-Archive -Path "dist-full/wvresp.exe" -DestinationPath wvresp-${{ github.ref_name }}-win-x64.zip
          Get-ChildItem *.zip | ForEach-Object { "{0} {1} bytes" -f $_.Name, $_.Length }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wvresp-windows
          path: "*.zip"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
